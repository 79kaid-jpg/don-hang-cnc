name: Deploy GitHub Pages
# Mỗi lần push vào main (thư mục web/ hoặc file này) sẽ build và deploy lên GitHub Pages
on:
  push: { branches: [main], paths: ['web/**', 'supabase/schema/**', 'tests/**', '.github/workflows/deploy.yml'] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  # Kiểm thử QT0→QT3 (PN→IPC→HW) trên DB Supabase tạm: sai → không deploy
  dbtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { DB: 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' }
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: |
          mkdir -p /tmp/sb && cd /tmp/sb && supabase init --force >/dev/null
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
      - run: psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/schema/baseline.sql
      - run: psql "$DB" -v ON_ERROR_STOP=1 -q -f tests/db/seed.sql
      - name: Chạy kịch bản TC02–TC10
        run: psql "$DB" -v ON_ERROR_STOP=1 -f tests/db/run.sql
  build:
    needs: dbtest
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build   # URL + publishable key lấy từ web/.env.production
      # Giữ file chương trình của các bản trước 7 ngày: máy còn giữ trang cũ vẫn tải được, không bị trắng trang sau khi cập nhật
      - uses: actions/cache/restore@v4
        with: { path: web/.prev-assets, key: 'pages-assets-${{ github.run_id }}', restore-keys: 'pages-assets-' }
      - run: |
          mkdir -p .prev-assets
          find .prev-assets -type f -mtime +7 -delete || true
          cp -n .prev-assets/* dist/assets/ 2>/dev/null || true
          cp -n dist/assets/* .prev-assets/ 2>/dev/null || true
          echo "Giữ lại $(ls .prev-assets | wc -l) file"
      - uses: actions/cache/save@v4
        with: { path: web/.prev-assets, key: 'pages-assets-${{ github.run_id }}' }
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
