name: Sao lưu cơ sở dữ liệu
on:
  schedule: [{ cron: '0 18 * * *' }]   # 01:00 giờ Việt Nam
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Cài pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump
        env: { DB_URL: '${{ secrets.SUPABASE_DB_URL }}' }
        run: |
          d=$(date -u +%Y%m%d)
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --schema=public --schema=auth --no-owner -Fc -f "don-hang-cnc-$d.dump"
      - uses: actions/upload-artifact@v4
        with: { name: 'db-backup', path: '*.dump', retention-days: 30 }
